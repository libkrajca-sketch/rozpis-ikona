<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozpis</title>
<meta name="apple-mobile-web-app-title" content="Rozpis">
<meta name="theme-color" content="#182233">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
       background:#182233;color:#e8ecf3;font:16px -apple-system,system-ui,sans-serif;text-align:center;padding:16px}
  img{width:96px;height:96px;border-radius:22px}
  a{color:#f0a92e}
</style>
</head>
<body>
<img src="apple-touch-icon.png" alt="">
<div>Otevírám Rozpis…</div>
<a href="https://script.google.com/macros/s/AKfycbxmpJthHdw8vqOJO0xcGr_X5_Ok6CtJbPWGOV3h0k4u4uZSp0YB1hwp589dm-eDE9Jx/exec">Pokud se nic neděje, klepni sem</a>
<script>
  // Adresa končící #plocha = jen zobrazit (kvůli přidání na plochu), jinak hned přesměrovat do appky.
  // #plocha se z adresy hned smaže, aby se na plochu uložila čistá adresa (ta pak přesměrovává).
  var u = "https://script.google.com/macros/s/AKfycbxmpJthHdw8vqOJO0xcGr_X5_Ok6CtJbPWGOV3h0k4u4uZSp0YB1hwp589dm-eDE9Jx/exec";
  if (location.hash === '#plocha') {
    history.replaceState(null, '', location.pathname);
    document.querySelector('div').textContent = 'Teď dej Sdílet → Přidat na plochu.';
  } else setTimeout(function () { location.replace(u); }, 300);
</script>
</body>
</html>
