<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rozpis</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rozpis">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#182233">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#182233;color:#e8ecf3;font:16px -apple-system,system-ui,sans-serif}
  #app{position:fixed;left:0;right:0;top:0;bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-bottom));border:0;visibility:hidden;background:#182233}
  #info{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box;background:#182233;z-index:2}
  #info img{width:96px;height:96px;border-radius:22px}
  #info b{color:#f0a92e}
  a{color:#f0a92e}
</style>
</head>
<body>
<div id="info">
  <img src="apple-touch-icon.png" alt="">
  <div id="txt">Načítám…</div>
</div>
<iframe id="app" title="Rozpis" allow="clipboard-write; web-share"></iframe>
<script>
  // Adresa appky (Apps Script) – klíč se bere z odkazu ?k=… (je jen v ikoně na ploše, ne tady na GitHubu)
  var APP = "https://script.google.com/macros/s/AKfycbxmpJthHdw8vqOJO0xcGr_X5_Ok6CtJbPWGOV3h0k4u4uZSp0YB1hwp589dm-eDE9Jx/exec";
  var k = new URLSearchParams(location.search).get('k');
  var plocha = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  var txt = document.getElementById('txt');
  if (!k) {
    txt.innerHTML = 'Chybí klíč.<br>Odkaz s klíčem vytvoříš v tabulce:<br><b>Rozpis → Appka: nový klíč</b>.';
  } else if (plocha) {
    var f = document.getElementById('app'), url = APP + '?k=' + encodeURIComponent(k), hotovo = false;
    // Appku ukázat hned, jak je stránka v rámu – nečekat na načtení všech souborů (písma apod.),
    // na iPadu to umělo trvat i desítky sekund. Appka má vlastní „Načítám…“.
    var ukaz = function () {
      if (hotovo) return; hotovo = true;
      f.style.visibility = 'visible';
      document.getElementById('info').style.display = 'none';
    };
    f.onload = ukaz;
    f.src = url;
    setTimeout(ukaz, 2500);
  } else {
    txt.innerHTML = 'Teď dej <b>Sdílet → Přidat na plochu</b>.<br><br>Appku pak otevírej ikonou z plochy –<br>poběží na celou obrazovku.<br><br>' +
      '<a href="' + APP + '?k=' + encodeURIComponent(k) + '">nebo otevřít teď v prohlížeči</a>';
  }
</script>
</body>
</html>
